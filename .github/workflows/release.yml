name: Create Release Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  verify-version:
    name: Verify Version Matches Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from version.py
        id: get-version
        run: |
          VERSION=$(python3 -c "exec(open('version.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version in version.py: $VERSION"

      - name: Verify tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION="${{ steps.get-version.outputs.version }}"

          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match version.py ($FILE_VERSION)"
            exit 1
          fi

          echo "Version verified: $TAG_VERSION"

  create-packages:
    name: Create Release Packages
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dashboard package (macOS)
        run: |
          mkdir -p dist
          tar -czf "dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-macos.tar.gz" \
            packages/ \
            apps/dashboard/ \
            install/ \
            version.py \
            README.md

      - name: Create dashboard package (Windows)
        run: |
          zip -r "dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-windows.zip" \
            packages/ \
            apps/dashboard/ \
            install/ \
            version.py \
            README.md

      - name: Create dashboard package (Linux)
        run: |
          tar -czf "dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-linux.tar.gz" \
            packages/ \
            apps/dashboard/ \
            install/ \
            version.py \
            README.md

      - name: Create device package (Raspberry Pi)
        run: |
          tar -czf "dist/BehaviorBoxController-${{ github.ref_name }}-device-raspberrypi.tar.gz" \
            packages/ \
            apps/device/ \
            install/ \
            version.py \
            README.md

      - name: Create complete package
        run: |
          tar -czf "dist/BehaviorBoxController-${{ github.ref_name }}-complete.tar.gz" \
            packages/ \
            apps/ \
            install/ \
            version.py \
            README.md

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/
          retention-days: 5

  create-release:
    name: Create GitHub Release
    needs: [verify-version, create-packages]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/

      - name: Generate release notes
        id: release-notes
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "## Changes since $PREVIOUS_TAG" > release_notes.md
            echo "" >> release_notes.md
            git log $PREVIOUS_TAG..${{ github.ref_name }} --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "" >> release_notes.md
            echo "First release of Behavior Box Controller" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "Download the appropriate package for your platform:" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Dashboard (macOS)**: \`BehaviorBoxController-${{ github.ref_name }}-dashboard-macos.tar.gz\`" >> release_notes.md
          echo "- **Dashboard (Windows)**: \`BehaviorBoxController-${{ github.ref_name }}-dashboard-windows.zip\`" >> release_notes.md
          echo "- **Dashboard (Linux)**: \`BehaviorBoxController-${{ github.ref_name }}-dashboard-linux.tar.gz\`" >> release_notes.md
          echo "- **Device (Raspberry Pi)**: \`BehaviorBoxController-${{ github.ref_name }}-device-raspberrypi.tar.gz\`" >> release_notes.md
          echo "- **Complete (All components)**: \`BehaviorBoxController-${{ github.ref_name }}-complete.tar.gz\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "See \`install/README.md\` in the package for installation instructions." >> release_notes.md
          echo "" >> release_notes.md
          echo "## Checksums" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          cat dist/checksums.txt >> release_notes.md
          echo "\`\`\`" >> release_notes.md

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-macos.tar.gz
            dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-windows.zip
            dist/BehaviorBoxController-${{ github.ref_name }}-dashboard-linux.tar.gz
            dist/BehaviorBoxController-${{ github.ref_name }}-device-raspberrypi.tar.gz
            dist/BehaviorBoxController-${{ github.ref_name }}-complete.tar.gz
            dist/checksums.txt
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          prerelease: false
