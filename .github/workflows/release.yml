name: Build Release

# Builds the dashboard and device for each platform when a release is published, and attaches them to the release.
# The release's tag must match the dashboard and device versions, e.g. `v1.4.0`.
on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  verify-version:
    name: Verify versions match tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with dashboard and device versions
        run: |
          TAG_VERSION="${TAG#v}"
          DASHBOARD_VERSION=$(jq -r .version dashboard/package.json)
          DEVICE_VERSION=$(sed -n 's/.*kDeviceVersion = "\(.*\)".*/\1/p' device/src/version.h)
          echo "Tag: $TAG_VERSION, dashboard: $DASHBOARD_VERSION, device: $DEVICE_VERSION"
          if [ "$TAG_VERSION" != "$DASHBOARD_VERSION" ] || [ "$TAG_VERSION" != "$DEVICE_VERSION" ]; then
            echo "::error::Tag $TAG does not match dashboard/package.json ($DASHBOARD_VERSION) and device/src/version.h ($DEVICE_VERSION)"
            exit 1
          fi

  dashboard:
    name: Dashboard (${{ matrix.name }})
    needs: verify-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: --mac dmg --arm64 --x64
          - name: Windows
            runner: windows-latest
            args: --win nsis --x64
    defaults:
      run:
        shell: bash
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: dashboard/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Unsigned, since no signing certificates are configured
      - name: Build and package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >
          yarn electron:build ${{ matrix.args }} --publish never
          '-c.artifactName=bbox-dashboard-${version}-${os}-${arch}.${ext}'

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ matrix.name }}
          path: |
            dashboard/release/*.dmg
            dashboard/release/*.exe
          if-no-files-found: error

  device-mac:
    name: Device (macOS)
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL
        run: brew install sdl3 sdl3_ttf pkg-config

      - name: Build
        working-directory: device
        run: make mac

      - name: Package
        run: |
          NAME="bbox-device-${TAG#v}-mac-arm64"
          mkdir -p "package/$NAME"
          cp -R device/dist/mac/behavior_box_device device/dist/mac/assets device/README.md "package/$NAME/"
          mkdir -p "package/$NAME/licenses"
          for dir in device/third_party/*/; do
            for file in "$dir"LICENSE*; do
              cp "$file" "package/$NAME/licenses/$(basename "$dir")-$(basename "$file")"
            done
          done
          tar -czf "$NAME.tar.gz" -C package "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: device-mac
          path: bbox-device-*.tar.gz
          if-no-files-found: error

  device-pi:
    name: Device (Raspberry Pi)
    needs: verify-version
    # Built natively on 64-bit ARM in Debian Trixie, which packages SDL3, so the binary runs on Raspberry Pi OS Trixie
    # and later. SDL is not included, see device/README.md.
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    steps:
      - name: Install build tools and SDL
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates build-essential pkg-config \
            libsdl3-dev libsdl3-ttf-dev

      - uses: actions/checkout@v4

      - name: Build
        working-directory: device
        run: make pi

      - name: Package
        run: |
          NAME="bbox-device-${TAG#v}-pi-arm64"
          mkdir -p "package/$NAME/licenses"
          cp -R device/dist/pi/behavior_box_device device/dist/pi/assets device/README.md "package/$NAME/"
          for dir in device/third_party/*/; do
            for file in "$dir"LICENSE*; do
              cp "$file" "package/$NAME/licenses/$(basename "$dir")-$(basename "$file")"
            done
          done
          tar -czf "$NAME.tar.gz" -C package "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: device-pi
          path: bbox-device-*.tar.gz
          if-no-files-found: error

  attach:
    name: Attach to release
    needs: [dashboard, device-mac, device-pi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber --repo "${{ github.repository }}"
